<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b7e0db">
  <link rel="icon" type="image/png" sizes="400x400" href="assets/images/advent-icon.png?v=3">
  <meta name="description" content="24 Überraschungen bis Weihnachten.">
  <title>Panikfee-Adventskalender</title>
  <link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main id="start">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">Panikfee-Adventskalender</h1>
    </section>

    <section class="calendar-wrap" aria-label="Adventskalender">
      <label class="date-lock-control">
        <span>Freischaltung nach Datum</span>
        <input id="date-lock-toggle" type="checkbox" aria-label="Freischaltung nach Datum aktivieren">
        <span class="date-lock-switch" aria-hidden="true"><span></span></span>
      </label>
      <div class="calendar" id="calendar" aria-label="24 Türchen"></div>
    </section>
  </main>

  <dialog class="surprise" id="surprise" aria-labelledby="modal-title">
    <button class="close" type="button" aria-label="Schließen">×</button>
    <div class="modal-day" id="modal-day">TÜRCHEN 01</div>
    <h2 id="modal-title">Projekt-Titel</h2>
    <div class="modal-media" id="modal-media"></div>
    <p class="modal-copy" id="modal-copy"></p>
    <div class="modal-author" id="modal-author"></div>
  </dialog>

  <dialog class="image-viewer" id="image-viewer" aria-label="Bild in Vollbild">
    <button class="image-viewer-close" type="button" aria-label="Vollbild schließen">×</button>
    <img id="fullscreen-image" alt="">
  </dialog>
  <script src="script.js?v=17"></script>
</body>
</html>
